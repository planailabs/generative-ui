[package]
name = "direct-access"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Direct-access demo: HTTP server + a swiftide agent in one binary, driving interactive UI through the directory."

[lib]
name = "direct_access"
path = "src/lib.rs"

[[bin]]
name = "direct-access"
path = "src/main.rs"

[dependencies]
gui-schema.workspace = true
gui-agent.workspace = true
gui-server.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
clap.workspace = true
async-trait = "0.1"
# Latest swiftide from git (its OpenAI integration targets the current async-openai 0.41 API).
swiftide = { git = "https://github.com/bosun-ai/swiftide", features = ["swiftide-agents"] }
# Real OpenAI(-compatible) backend is opt-in: `--features openai`. We only use it to build a
# client with a custom base URL; `chat-completion` exposes Client + config.
# Pin to the version git swiftide's lockfile uses; >=0.33 otherwise resolves to 0.41 which
# renamed the error/schema API swiftide builds against.
async-openai = { version = "=0.33.0", optional = true, features = ["chat-completion"] }

[features]
openai = ["swiftide/openai", "dep:async-openai"]

[dev-dependencies]
tempfile.workspace = true
