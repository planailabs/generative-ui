[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gui-schema = { path = "crates/gui-schema" }
gui-agent = { path = "crates/gui-agent" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-std", "net", "signal"] }
axum = "0.8"
arc-swap = "1"
mime_guess = "2"
notify = "8"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
