[workspace]
resolver = "2"
members = ["crates/*", "examples/*"]
# The WASM handler guest is built only for wasm32-unknown-unknown (its own workspace), so it
# must not be pulled into the host workspace build.
exclude = ["examples/handler-wasm"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
gui-schema = { path = "crates/gui-schema" }
gui-agent = { path = "crates/gui-agent" }
gui-server = { path = "crates/gui-server" }
gui-mcp = { path = "crates/gui-mcp" }
gui-runtime = { path = "crates/gui-runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time", "io-std", "net", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
arc-swap = "1"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
