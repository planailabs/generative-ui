[package]
name = "gui-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Engines are wired behind features in their own stages. Default builds the host + dispatch
# only; `engine_for` reports an engine unavailable until its feature (and dep) is on. Each
# feature gains its `dep:<crate>` in the stage that implements it.
default = []
js = []
lua = []
wasm = []

[dependencies]
gui-schema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ureq = "2"
url = "2"

[dev-dependencies]
tempfile = { workspace = true }
