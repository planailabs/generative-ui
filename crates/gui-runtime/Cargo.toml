[package]
name = "gui-runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# Engines are wired behind features in their own stages. Default builds the host + dispatch
# only; `engine_for` reports an engine unavailable until its feature (and dep) is on. Each
# feature gains its `dep:<crate>` in the stage that implements it.
# Engines added per stage; each gains its line in `default` as it lands so the workspace
# builds the full set. (lua, wasm to follow.)
default = ["js", "lua", "wasm"]
js = ["dep:rquickjs"]
lua = ["dep:mlua"]
wasm = ["dep:wasmtime"]

[dependencies]
gui-schema = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ureq = "2"
url = "2"
http = "1"
ring = "0.17"
base64 = "0.22"
subtle = "2"
# X25519 ECDH: ring's `agreement` is ephemeral-only (private keys can't be imported from bytes),
# so a stateless derive-from-stored-key needs dalek.
x25519-dalek = { version = "2", features = ["static_secrets"] }
rquickjs = { version = "0.9", optional = true }
mlua = { version = "0.10", features = ["luau", "vendored", "serialize"], optional = true }
wasmtime = { version = "45", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
